name: Deploy Web to Firebase Hosting Production

on:
  workflow_dispatch:

jobs:
  build_and_deploy_production:
    name: Build & Deploy Production Web App
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
          
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
          
      - name: Build Web (Production)
        run: npm run build:production
        
      - name: Deploy to Firebase Hosting (Production)
        run: npx firebase-tools deploy --only hosting --project coramdeo-prod --token "${{ secrets.FIREBASE_TOKEN_PRODUCTION }}"
