<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <!-- Soft Ambient Elevation Shadow (White Card Surface Option A) -->
    <filter id="calmGlassShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1E3A5F" flood-opacity="0.14" />
    </filter>

    <!-- Inner Portal Elevation Shadow -->
    <filter id="portalCardShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>

    <!-- Top Crown Panes: Soft Frosted Sky Mist -->
    <linearGradient id="glassCrown" x1="200" y1="40" x2="200" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DCE6EE" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#9AB7C9" stop-opacity="0.32" />
    </linearGradient>

    <!-- Upper-Mid Panes: Frosted Ice & Slate Mist -->
    <linearGradient id="glassUpperMid" x1="96" y1="102" x2="304" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8F0F6" stop-opacity="0.70" />
      <stop offset="100%" stop-color="#9AB7C9" stop-opacity="0.36" />
    </linearGradient>

    <!-- Mid-Side Panes: Calm Nordic Slate Glass -->
    <linearGradient id="glassMid" x1="80" y1="164" x2="320" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DCE6EE" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#7B9EB2" stop-opacity="0.34" />
    </linearGradient>

    <!-- Lower Panes: Deep Atmospheric Mist -->
    <linearGradient id="glassLower" x1="200" y1="248" x2="200" y2="356" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9AB7C9" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#DCE6EE" stop-opacity="0.60" />
    </linearGradient>

    <!-- Bottom Corner Spandrels: Nordic Slate-Blue Tint -->
    <linearGradient id="glassSpandrel" x1="80" y1="260" x2="146" y2="356" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F748E" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#6B8EA5" stop-opacity="0.45" />
    </linearGradient>

    <!-- Central Sanctuary Portal: Deep Slate-Navy to Obsidian Ink (White Card Surface Option A) -->
    <linearGradient id="sanctuaryPortal" x1="200" y1="146" x2="200" y2="356" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A5F" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.96" />
    </linearGradient>

    <!-- Nordic Slate-Blue Structural Leadline Gradient (White Card Surface Option A) -->
    <linearGradient id="slateLeadline" x1="200" y1="36" x2="200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F748E" />
      <stop offset="70%" stop-color="#537891" />
      <stop offset="100%" stop-color="#2C4A60" />
    </linearGradient>

    <!-- Master Clip Path of Outer Cathedral Arch -->
    <clipPath id="cathedralClip">
      <path d="M 78 348
               L 78 248
               C 78 148, 128 76, 200 38
               C 272 76, 322 148, 322 248
               L 322 348
               A 8 8 0 0 1 314 356
               L 86 356
               A 8 8 0 0 1 78 348 Z" />
    </clipPath>
  </defs>

  <g filter="url(#calmGlassShadow)">
    <!-- 1. Translucent Frosted Stained-Glass Panes -->
    <g clip-path="url(#cathedralClip)">
      <!-- Top Crown Panes (Left & Right of Central Mullion) -->
      <path d="M 200 38 L 200 146 C 180 124, 158 109, 132 100 C 152 74, 175 53, 200 38 Z" fill="url(#glassCrown)" />
      <path d="M 200 38 L 200 146 C 220 124, 242 109, 268 100 C 248 74, 225 53, 200 38 Z" fill="url(#glassCrown)" />

      <!-- Upper-Mid Panes (Between Intersecting Primary & Secondary Gothic Arcs) -->
      <path d="M 132 100 C 158 109, 180 124, 200 146 C 172 174, 152 208, 146 248 C 138 206, 118 178, 94 162 C 104 138, 117 118, 132 100 Z" fill="url(#glassUpperMid)" />
      <path d="M 268 100 C 242 109, 220 124, 200 146 C 228 174, 248 208, 254 248 C 262 206, 282 178, 306 162 C 296 138, 283 118, 268 100 Z" fill="url(#glassUpperMid)" />

      <!-- Mid-Side Panes (Between Secondary Gothic Arcs and Horizontal Transom y=248) -->
      <path d="M 94 162 C 118 178, 138 206, 146 248 L 78 248 C 78 216, 84 188, 94 162 Z" fill="url(#glassMid)" />
      <path d="M 306 162 C 282 178, 262 206, 254 248 L 322 248 C 322 216, 316 188, 306 162 Z" fill="url(#glassMid)" />

      <!-- Lower-Mid Panes (Below Horizontal Transom, Inside Lower Sweeping Arcs) -->
      <path d="M 78 248 L 146 248 L 146 356 C 110 332, 84 294, 78 248 Z" fill="url(#glassLower)" />
      <path d="M 322 248 L 254 248 L 254 356 C 290 332, 316 294, 322 248 Z" fill="url(#glassLower)" />

      <!-- Bottom-Corner Spandrel Panes -->
      <path d="M 78 248 C 84 294, 110 332, 146 356 L 78 356 Z" fill="url(#glassSpandrel)" />
      <path d="M 322 248 C 316 294, 290 332, 254 356 L 322 356 Z" fill="url(#glassSpandrel)" />

      <!-- Central Sanctuary Portal (Deep Slate-Navy to Obsidian Ink) -->
      <path d="M 146 356 L 146 248 C 152 208, 172 174, 200 146 C 228 174, 248 208, 254 248 L 254 356 Z"
            fill="url(#sanctuaryPortal)"
            filter="url(#portalCardShadow)" />
    </g>

    <!-- 2. Continuous Intersecting Gothic Tracery Leadlines (Decreased Sleek Refined Stroke) -->
    <g stroke="url(#slateLeadline)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Central Vertical Mullion (Outer Apex to Inner Apex) -->
      <line x1="200" y1="42" x2="200" y2="146" />

      <!-- Continuous Intersecting Gothic Curve 1: Left-Upper Outer Arch -> Inner Apex -> Right Sanctuary Leg -->
      <path d="M 132 100
               C 158 109, 180 124, 200 146
               C 228 174, 248 208, 254 248
               L 254 356" />

      <!-- Continuous Intersecting Gothic Curve 2: Right-Upper Outer Arch -> Inner Apex -> Left Sanctuary Leg -->
      <path d="M 268 100
               C 242 109, 220 124, 200 146
               C 172 174, 152 208, 146 248
               L 146 356" />

      <!-- Secondary Radial Gothic Ribs -->
      <path d="M 94 162 C 118 178, 138 206, 146 248" />
      <path d="M 306 162 C 282 178, 262 206, 254 248" />

      <!-- Horizontal Transoms -->
      <line x1="78" y1="248" x2="146" y2="248" />
      <line x1="254" y1="248" x2="322" y2="248" />

      <!-- Tangential Lower Sweeping Spandrel Arcs -->
      <path d="M 78 248 C 84 294, 110 332, 146 356" />
      <path d="M 322 248 C 316 294, 290 332, 254 356" />

      <!-- Outer Pointed Cathedral Arch Frame -->
      <path d="M 78 348
               L 78 248
               C 78 148, 128 76, 200 38
               C 272 76, 322 148, 322 248
               L 322 348
               A 8 8 0 0 1 314 356
               L 86 356
               A 8 8 0 0 1 78 348 Z" />
    </g>
  </g>
</svg>
